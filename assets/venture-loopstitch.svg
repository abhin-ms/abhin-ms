<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="400" height="250" viewBox="0 0 400 250" fill="none">
<style>
.sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}

.sweep{animation:sweep 3.2s cubic-bezier(.6,0,.2,1) infinite}
@keyframes sweep{0%{transform:translateX(-140px)}60%,100%{transform:translateX(400px)}}
.pulse{animation:pulse 2.2s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes pulse{0%,100%{opacity:.9}50%{opacity:.25}}
.halo{animation:halo 2.6s ease-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes halo{from{transform:scale(1);opacity:.5}to{transform:scale(1.55);opacity:0}}
</style>
<defs><pattern id="dotsloopstitch" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#1d2633"/></pattern><clipPath id="cardloopstitch"><rect width="400" height="250" rx="18"/></clipPath></defs><rect width="400" height="250" rx="18" fill="#0a0e13"/><g clip-path="url(#cardloopstitch)"><rect width="400" height="250" fill="url(#dotsloopstitch)" opacity=".55"/></g>
<defs><linearGradient id="swloopstitch" x1="0" x2="1"><stop offset="0" stop-color="#ff5b5b" stop-opacity="0"/><stop offset=".5" stop-color="#ff5b5b"/><stop offset="1" stop-color="#ff5b5b" stop-opacity="0"/></linearGradient><radialGradient id="glloopstitch"><stop offset="0" stop-color="#ff5b5b" stop-opacity=".18"/><stop offset="1" stop-color="#ff5b5b" stop-opacity="0"/></radialGradient></defs>
<g clip-path="url(#cardloopstitch)"><circle cx="400" cy="0" r="200" fill="url(#glloopstitch)"/><rect class="sweep" x="0" y="0" width="140" height="2.5" fill="url(#swloopstitch)"/></g>
<rect class="halo" x="28" y="28" width="48" height="48" rx="14" stroke="#ff5b5b"/>
<rect x="28" y="28" width="48" height="48" rx="14" fill="#ff5b5b" fill-opacity=".12" stroke="#ff5b5b" stroke-opacity=".5"/>
<g transform="translate(40,40)"><path d="M8 3 3.5 5.5 5 10l2.5-1V20h9V9l2.5 1L20.5 5.5 16 3c-.6 1.8-2.1 3-4 3s-3.4-1.2-4-3Z" stroke="#ff5b5b" stroke-width="2" stroke-linejoin="round"/></g>
<g transform="translate(285,38)"><g transform="translate(0,0)"><rect width="87" height="25" rx="12.5" fill="#0f141b" stroke="#ff5b5b" stroke-opacity=".45"/><text x="43.5" y="16.5" text-anchor="middle" class="mono" font-size="11" fill="#ff5b5b">LAUNCHING</text></g></g>
<text x="28" y="118" class="sans" font-size="25" font-weight="700" fill="#e8edf3">Loopstitch</text>
<text x="28" y="148" class="sans" font-size="15" fill="#8a97a8">Streetwear label + custom prints</text>
<text x="28" y="170" class="sans" font-size="15" fill="#8a97a8">from a single piece. Store built</text>
<text x="28" y="192" class="sans" font-size="15" fill="#8a97a8">in-house on FastAPI + React.</text>
<line x1="28" y1="204" x2="372" y2="204" stroke="#1d2633"/>
<circle class="pulse" cx="34" cy="226" r="4" fill="#ff5b5b"/>
<text x="46" y="230.5" class="mono" font-size="13.5" fill="#ff5b5b">loopstitch.online</text>
<text x="372" y="231" text-anchor="end" class="mono" font-size="15" fill="#ff5b5b">↗</text>
<rect x=".5" y=".5" width="399" height="249" rx="17.5" stroke="#1d2633"/>
</svg>
