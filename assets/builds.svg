<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1200" height="470" viewBox="0 0 1200 470" fill="none">
<style>
.sans{font-family:'Segoe UI',Ubuntu,'Helvetica Neue',Arial,sans-serif} .mono{font-family:'JetBrains Mono','SFMono-Regular',Consolas,'Liberation Mono',Menlo,monospace}

.tile{animation:fadeup .8s cubic-bezier(.2,.7,.2,1) both}
@keyframes fadeup{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
.bar{animation:bar 4s ease-in-out infinite;transform-box:fill-box;transform-origin:left}
@keyframes bar{0%,100%{transform:scaleX(.25)}50%{transform:scaleX(1)}}
</style>
<defs><pattern id="dotsw" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1.5" cy="1.5" r="1.1" fill="#1d2633"/></pattern><clipPath id="cardw"><rect width="1200" height="470" rx="18"/></clipPath></defs><rect width="1200" height="470" rx="18" fill="#0a0e13"/><g clip-path="url(#cardw)"><rect width="1200" height="470" fill="url(#dotsw)" opacity=".55"/></g>
<g transform="translate(22.0,22.0)"><g class="tile" style="animation-delay:0.00s">
<rect width="373.3" height="204.0" rx="14" fill="#0f141b" stroke="#1d2633"/>
<text x="22" y="40" class="mono" font-size="13" fill="#3ddc97">01</text>
<rect class="bar" style="animation-delay:0.0s" x="52" y="34" width="299" height="2" rx="1" fill="#3ddc97" fill-opacity=".55"/>
<text x="22" y="80" class="sans" font-size="20" font-weight="700" fill="#e8edf3">Analytics dashboards</text>
<text x="22" y="110" class="sans" font-size="14.5" fill="#8a97a8">Live KPIs, role-based access,</text>
<text x="22" y="132" class="sans" font-size="14.5" fill="#8a97a8">Google Sheets sync — runs a</text>
<text x="22" y="154" class="sans" font-size="14.5" fill="#8a97a8">24-store retail chain.</text>
</g></g>
<g transform="translate(413.3,22.0)"><g class="tile" style="animation-delay:0.12s">
<rect width="373.3" height="204.0" rx="14" fill="#0f141b" stroke="#1d2633"/>
<text x="22" y="40" class="mono" font-size="13" fill="#5aa9ff">02</text>
<rect class="bar" style="animation-delay:0.5s" x="52" y="34" width="299" height="2" rx="1" fill="#5aa9ff" fill-opacity=".55"/>
<text x="22" y="80" class="sans" font-size="20" font-weight="700" fill="#e8edf3">Telecalling CRMs</text>
<text x="22" y="110" class="sans" font-size="14.5" fill="#8a97a8">Leads flow in straight from</text>
<text x="22" y="132" class="sans" font-size="14.5" fill="#8a97a8">Meta lead ads and website</text>
<text x="22" y="154" class="sans" font-size="14.5" fill="#8a97a8">webhooks to the call queue.</text>
</g></g>
<g transform="translate(804.7,22.0)"><g class="tile" style="animation-delay:0.24s">
<rect width="373.3" height="204.0" rx="14" fill="#0f141b" stroke="#1d2633"/>
<text x="22" y="40" class="mono" font-size="13" fill="#3ddc97">03</text>
<rect class="bar" style="animation-delay:1.0s" x="52" y="34" width="299" height="2" rx="1" fill="#3ddc97" fill-opacity=".55"/>
<text x="22" y="80" class="sans" font-size="20" font-weight="700" fill="#e8edf3">WhatsApp automation</text>
<text x="22" y="110" class="sans" font-size="14.5" fill="#8a97a8">Cloud API panels, bulk</text>
<text x="22" y="132" class="sans" font-size="14.5" fill="#8a97a8">campaigns, delivery &amp; cost</text>
<text x="22" y="154" class="sans" font-size="14.5" fill="#8a97a8">reporting for brands.</text>
</g></g>
<g transform="translate(22.0,244.0)"><g class="tile" style="animation-delay:0.36s">
<rect width="373.3" height="204.0" rx="14" fill="#0f141b" stroke="#1d2633"/>
<text x="22" y="40" class="mono" font-size="13" fill="#ffb547">04</text>
<rect class="bar" style="animation-delay:1.5s" x="52" y="34" width="299" height="2" rx="1" fill="#ffb547" fill-opacity=".55"/>
<text x="22" y="80" class="sans" font-size="20" font-weight="700" fill="#e8edf3">Queue &amp; token systems</text>
<text x="22" y="110" class="sans" font-size="14.5" fill="#8a97a8">QR token generation, staff</text>
<text x="22" y="132" class="sans" font-size="14.5" fill="#8a97a8">dashboards and live TV</text>
<text x="22" y="154" class="sans" font-size="14.5" fill="#8a97a8">display boards.</text>
</g></g>
<g transform="translate(413.3,244.0)"><g class="tile" style="animation-delay:0.48s">
<rect width="373.3" height="204.0" rx="14" fill="#0f141b" stroke="#1d2633"/>
<text x="22" y="40" class="mono" font-size="13" fill="#ff5b5b">05</text>
<rect class="bar" style="animation-delay:2.0s" x="52" y="34" width="299" height="2" rx="1" fill="#ff5b5b" fill-opacity=".55"/>
<text x="22" y="80" class="sans" font-size="20" font-weight="700" fill="#e8edf3">E-commerce stores</text>
<text x="22" y="110" class="sans" font-size="14.5" fill="#8a97a8">Per-size stock locking,</text>
<text x="22" y="132" class="sans" font-size="14.5" fill="#8a97a8">hidden admin panel, PDF</text>
<text x="22" y="154" class="sans" font-size="14.5" fill="#8a97a8">invoices, payment gateway.</text>
</g></g>
<g transform="translate(804.7,244.0)"><g class="tile" style="animation-delay:0.60s">
<rect width="373.3" height="204.0" rx="14" fill="#0f141b" stroke="#1d2633"/>
<text x="22" y="40" class="mono" font-size="13" fill="#5aa9ff">06</text>
<rect class="bar" style="animation-delay:2.5s" x="52" y="34" width="299" height="2" rx="1" fill="#5aa9ff" fill-opacity=".55"/>
<text x="22" y="80" class="sans" font-size="20" font-weight="700" fill="#e8edf3">AI voice agents</text>
<text x="22" y="110" class="sans" font-size="14.5" fill="#8a97a8">Prompt-driven agents that</text>
<text x="22" y="132" class="sans" font-size="14.5" fill="#8a97a8">call customers on a rented</text>
<text x="22" y="154" class="sans" font-size="14.5" fill="#8a97a8">number. In progress.</text>
</g></g>
<rect x=".5" y=".5" width="1199" height="469" rx="17.5" stroke="#1d2633"/>
</svg>
