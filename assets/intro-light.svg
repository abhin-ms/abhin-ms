<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="293" viewBox="0 0 900 293" fill="none">
<style>
@font-face{font-family:Brico;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:Brico;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:Brico;font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:Brico,'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,sans-serif}

.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.15) both;transform-box:fill-box;transform-origin:0 100%}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.dot{animation:dot 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

@keyframes ty1{0%,52.94%{opacity:0}52.95%,99.5%{opacity:1}100%{opacity:0}}
@keyframes ty2{0%,73.77%{opacity:0}73.78%,99.5%{opacity:1}100%{opacity:0}}
@keyframes ty3{0%,81.82%{opacity:0}81.83%,99.5%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g opacity="0" style="animation:ty1 1.70s linear forwards"><path d="M5.0,6.0 H46.0 Q64.0,6.0 64.0,24.0 V28.0 Q64.0,46.0 46.0,46.0 H18.0 Q0.0,46.0 0.0,28.0 V11.0 Q0.0,6.0 5.0,6.0 Z" fill="#eef0f9"/><circle class="dot" style="animation-delay:0.00s" cx="20" cy="26" r="3.6" fill="#59618a"/><circle class="dot" style="animation-delay:0.15s" cx="32" cy="26" r="3.6" fill="#59618a"/><circle class="dot" style="animation-delay:0.30s" cx="44" cy="26" r="3.6" fill="#59618a"/></g><g class="pop" style="animation-delay:1.70s"><path d="M5.0,6.0 H467.2 Q485.2,6.0 485.2,24.0 V91.0 Q485.2,109.0 467.2,109.0 H18.0 Q0.0,109.0 0.0,91.0 V11.0 Q0.0,6.0 5.0,6.0 Z" fill="#eef0f9"/><text x="26.0" y="81.8" font-size="60" font-weight="800" fill="#161a2e">Hey, I'm Abhin.</text></g>
<g opacity="0" style="animation:ty2 3.05s linear forwards"><path d="M5.0,119.0 H46.0 Q64.0,119.0 64.0,137.0 V141.0 Q64.0,159.0 46.0,159.0 H18.0 Q0.0,159.0 0.0,141.0 V124.0 Q0.0,119.0 5.0,119.0 Z" fill="#eef0f9"/><circle class="dot" style="animation-delay:0.00s" cx="20" cy="139.0" r="3.6" fill="#59618a"/><circle class="dot" style="animation-delay:0.15s" cx="32" cy="139.0" r="3.6" fill="#59618a"/><circle class="dot" style="animation-delay:0.30s" cx="44" cy="139.0" r="3.6" fill="#59618a"/></g><g class="pop" style="animation-delay:3.05s"><path d="M5.0,119.0 H601.7 Q619.7,119.0 619.7,137.0 V202.9 Q619.7,220.9 601.7,220.9 H18.0 Q0.0,220.9 0.0,202.9 V124.0 Q0.0,119.0 5.0,119.0 Z" fill="#eef0f9"/><text x="18.0" y="150.7" font-size="19" font-weight="400" fill="#161a2e">I build the software small businesses run on: dashboards, CRMs</text><text x="18.0" y="177.7" font-size="19" font-weight="400" fill="#161a2e">and WhatsApp automation. Backend, frontend and hosting, end to</text><text x="18.0" y="204.6" font-size="19" font-weight="400" fill="#161a2e">end.</text></g>
<g opacity="0" style="animation:ty3 4.40s linear forwards"><path d="M5.0,230.9 H46.0 Q64.0,230.9 64.0,248.9 V252.9 Q64.0,270.9 46.0,270.9 H18.0 Q0.0,270.9 0.0,252.9 V235.9 Q0.0,230.9 5.0,230.9 Z" fill="#eef0f9"/><circle class="dot" style="animation-delay:0.00s" cx="20" cy="250.91" r="3.6" fill="#59618a"/><circle class="dot" style="animation-delay:0.15s" cx="32" cy="250.91" r="3.6" fill="#59618a"/><circle class="dot" style="animation-delay:0.30s" cx="44" cy="250.91" r="3.6" fill="#59618a"/></g><g class="pop" style="animation-delay:4.40s"><path d="M5.0,230.9 H481.4 Q499.4,230.9 499.4,248.9 V260.9 Q499.4,278.9 481.4,278.9 H18.0 Q0.0,278.9 0.0,260.9 V235.9 Q0.0,230.9 5.0,230.9 Z" fill="#eef0f9"/><text x="18.0" y="262.6" font-size="19" font-weight="400" fill="#161a2e">I also run three ventures of my own. Tap one to visit.</text></g>
