<rect x="8" y="8" width="274" height="150" rx="14" fill="#d7263d" fill-opacity=".16"/>
<g transform="translate(83.0,26) scale(1.24)"><path class="swap" d="M30 10 L8 22 L17 42 L28 37 L28 92 L72 92 L72 37 L83 42 L92 22 L70 10 C66 18 58 22 50 22 C42 22 34 18 30 10 Z" fill="#15151a" stroke="#d3d8ee" stroke-width="1"/><text x="50" y="58" text-anchor="middle" font-size="15" font-weight="800" fill="#d7263d">LS</text></g>
<rect x="20" y="20" width="111.02" height="24" rx="12" fill="#d7263d"/>
<text x="30.0" y="36.0" font-size="12" font-weight="600" fill="#ffffff">Launching soon</text>
<text x="18.0" y="196.0" font-size="23" font-weight="800" fill="#161a2e">Loopstitch</text>
<text x="18.0" y="224.0" font-size="15" font-weight="400" fill="#59618a">Streetwear and custom prints on</text>
<text x="18.0" y="245.0" font-size="15" font-weight="400" fill="#59618a">premium tees, from a single piece.</text>
<line x1="18" y1="286" x2="272" y2="286" stroke="#d3d8ee"/>
<text x="18.0" y="315.0" font-size="15" font-weight="600" fill="#d7263d">loopstitch.online</text>
