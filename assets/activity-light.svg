<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="900" height="56" viewBox="0 0 900 56" fill="none">
<style>
@font-face{font-family:Brico;font-weight:400;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:Brico;font-weight:600;src:url(data:font/woff2;base64,) format('woff2')}
@font-face{font-family:Brico;font-weight:800;src:url(data:font/woff2;base64,) format('woff2')}
text{font-family:Brico,'Bricolage Grotesque','Segoe UI',system-ui,-apple-system,sans-serif}

.pop{animation:pop .5s cubic-bezier(.2,.9,.3,1.15) both;transform-box:fill-box;transform-origin:0 100%}
@keyframes pop{from{opacity:0;transform:translateY(10px) scale(.96)}to{opacity:1;transform:none}}
.dot{animation:dot 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes dot{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

@keyframes ty1{0%,27.27%{opacity:0}27.28%,99.5%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion: reduce){*{animation:none!important}}
</style>
<g opacity="0" style="animation:ty1 1.10s linear forwards"><path d="M5.0,4.0 H46.0 Q64.0,4.0 64.0,22.0 V26.0 Q64.0,44.0 46.0,44.0 H18.0 Q0.0,44.0 0.0,26.0 V9.0 Q0.0,4.0 5.0,4.0 Z" fill="#eef0f9"/><circle class="dot" style="animation-delay:0.00s" cx="20" cy="24" r="3.6" fill="#59618a"/><circle class="dot" style="animation-delay:0.15s" cx="32" cy="24" r="3.6" fill="#59618a"/><circle class="dot" style="animation-delay:0.30s" cx="44" cy="24" r="3.6" fill="#59618a"/></g><g class="pop" style="animation-delay:1.10s"><path d="M5.0,4.0 H416.1 Q434.1,4.0 434.1,22.0 V34.0 Q434.1,52.0 416.1,52.0 H18.0 Q0.0,52.0 0.0,34.0 V9.0 Q0.0,4.0 5.0,4.0 Z" fill="#eef0f9"/><text x="18.0" y="35.7" font-size="19" font-weight="600" fill="#161a2e">And here's what my GitHub looks like lately:</text></g>
</svg>
